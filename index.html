<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kingcho Burger | Pedidos Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --accent-red: #d32f2f;
            --accent-gold: #fbc02d;
            --text-main: #f5f5f5;
            --text-muted: #b0b0b0;
            --success: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 90px; }

        header {
            text-align: center;
            padding: 2rem 1rem;
            background: linear-gradient(to bottom, #1a1a1a, var(--bg-dark));
            border-bottom: 1px solid #333;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-gold);
            margin-bottom: 0.5rem;
        }

        h1 { font-size: 1.8rem; letter-spacing: 2px; }
        .subtitle { font-size: 0.85rem; color: var(--accent-gold); letter-spacing: 2px; margin-bottom: 1rem; }

        .info-pills {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .info-pills span i { color: var(--accent-red); margin-right: 4px; }

        .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }

        /* Categorías de navegación */
        .categories-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0.5rem 1rem 1rem 1rem;
            max-width: 1000px;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: #222;
            border: 1px solid #444;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            color: white;
            font-weight: 600;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .product-card:hover { transform: translateY(-3px); border-color: #444; }
        .product-img { width: 100%; height: 150px; object-fit: cover; }
        .product-info { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-info h3 { font-size: 1.1rem; margin-bottom: 5px; }
        .product-info p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; }

        .card-bottom { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 1rem; font-weight: 700; color: var(--accent-gold); }

        .btn-add {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .btn-add:hover { background-color: #b71c1c; }

        /* Carrito Flotante */
        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1e1e1e;
            border: 1px solid var(--accent-gold);
            color: white;
            width: 90%;
            max-width: 500px;
            padding: 14px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            cursor: pointer;
            z-index: 100;
        }
        .cart-bar.hidden { display: none; }
        .cart-info { font-weight: 600; font-size: 0.95rem; }
        .cart-info span { background-color: var(--accent-red); padding: 2px 8px; border-radius: 10px; font-size: 0.85rem; margin-left: 5px; }
        .cart-total { font-weight: 700; color: var(--accent-gold); }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; padding: 1rem;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background-color: var(--bg-card);
            width: 100%; max-width: 500px;
            border-radius: 16px; padding: 1.5rem;
            border: 1px solid #333; max-height: 90vh; overflow-y: auto;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.2rem; border-bottom: 1px solid #333; padding-bottom: 10px;
        }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

        .cart-item-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px dashed #333; padding-bottom: 8px;
        }

        .checkout-form label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; margin-bottom: 4px; }
        .checkout-form select, .checkout-form input {
            width: 100%; padding: 10px; background-color: #2a2a2a;
            border: 1px solid #444; color: white; border-radius: 8px; font-size: 0.9rem;
        }

        .summary-line { display: flex; justify-content: space-between; font-size: 1.1rem; margin: 15px 0; font-weight: 700; }
        .btn-whatsapp {
            background-color: var(--success); color: white; width: 100%; padding: 12px;
            border: none; border-radius: 10px; font-weight: 700; font-size: 1rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <img src="assets/img/logo.jpg" alt="The Kingcho Logo" class="brand-logo" onerror="this.src='https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=100'">
        <h1>THE KINGCHO BURGER</h1>
        <p class="subtitle">HAMBURGUESERÍA ARTESANAL</p>
        <div class="info-pills">
            <span><i class="fa-solid fa-location-dot"></i> Manuel B. Gallardo 1032, G. Catán</span>
            <span><i class="fa-solid fa-utensils"></i> ¡Todas las burgers incluyen papas!</span>
            <span><i class="fa-solid fa-motorcycle"></i> Delivery & Take Away</span>
        </div>
    </header>

    <nav class="categories-nav">
        <button class="cat-btn active" onclick="filterCategory('todos', event)">Todos</button>
        <button class="cat-btn" onclick="filterCategory('burgers', event)">Burgers</button>
        <button class="cat-btn" onclick="filterCategory('compartir', event)">Para Compartir</button>
        <button class="cat-btn" onclick="filterCategory('extras', event)">Adicionales</button>
    </nav>

    <main class="container">
        <div id="products-grid" class="products-grid"></div>
    </main>

    <!-- Carrito Flotante -->
    <div id="cart-bar" class="cart-bar hidden" onclick="toggleCartModal()">
        <div class="cart-info"><i class="fa-solid fa-bag-shopping"></i> Pedido <span id="cart-count">0</span></div>
        <div class="cart-total">Total: <span id="cart-total-price">$0</span></div>
    </div>

    <!-- Modal Carrito -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Pedido en Kingcho</h2>
                <button class="close-btn" onclick="toggleCartModal()">&times;</button>
            </div>
            <div id="cart-items" style="margin-bottom: 15px;"></div>
            
            <div class="checkout-form">
                <label>Modalidad de entrega:</label>
                <select id="delivery-type">
                    <option value="delivery">Delivery a domicilio</option>
                    <option value="takeaway">Retiro por local (Take Away)</option>
                </select>

                <label>Dirección / Referencia:</label>
                <input type="text" id="client-address" placeholder="Ej: Manuel B. Gallardo...">

                <label>Observaciones:</label>
                <input type="text" id="client-notes" placeholder="Ej: Sin cebolla, cambiar carne por medallón NotCo">

                <div class="summary-line">
                    <span>Total a abonar:</span>
                    <strong id="modal-total-price" style="color: var(--accent-gold);">$0</strong>
                </div>

                <button class="btn-whatsapp" onclick="sendOrderToWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        const PHONE_NUMBER = "5491169966283"; // Teléfono oficial de Maps

        const products = [
            { id: 1, name: "Cheese Burger (Simple)", category: "burgers", description: "Carne, triple cheddar. Incluye papas.", price: 13900, image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" },
            { id: 2, name: "Cheese Burger (Doble)", category: "burgers", description: "Doble carne, triple cheddar. Incluye papas.", price: 17000, image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" },
            { id: 3, name: "King Cuarto (Simple)", category: "burgers", description: "Carne, triple cheddar, salsa libra, cebolla picada y pepinillos.", price: 15000, image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400" },
            { id: 4, name: "King Cuarto (Doble)", category: "burgers", description: "Doble carne, triple cheddar, salsa libra, cebolla picada y pepinillos.", price: 17500, image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400" },
            { id: 5, name: "Memphis (Simple)", category: "burgers", description: "Carne, triple cheddar, panceta ahumada, cebolla caramelizada y barbacoa.", price: 15500, image: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=400" },
            { id: 6, name: "Memphis (Doble)", category: "burgers", description: "Doble carne, triple cheddar, panceta ahumada, cebolla caramelizada y barbacoa.", price: 18000, image: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=400" },
            { id: 7, name: "Staker (Simple)", category: "burgers", description: "Carne, triple cheddar, panceta ahumada y salsa staker.", price: 15500, image: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=400" },
            { id: 8, name: "Staker (Doble)", category: "burgers", description: "Doble carne, triple cheddar, panceta ahumada y salsa staker.", price: 17500, image: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=400" },
            { id: 9, name: "Crispy (Simple)", category: "burgers", description: "Carne, triple cheddar, panceta ahumada, cebolla crispy y barbacoa.", price: 15500, image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400" },
            { id: 10, name: "Crispy (Doble)", category: "burgers", description: "Doble carne, triple cheddar, panceta ahumada, cebolla crispy y barbacoa.", price: 18000, image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400" },
            { id: 11, name: "Mozza Sticks (6 un.)", category: "compartir", description: "Bastones de muzzarella + dip de salsa.", price: 10500, image: "https://images.unsplash.com/photo-1548340748-6d2b7d7da280?w=400" },
            { id: 12, name: "King Nuggets (8 un.)", category: "compartir", description: "Nuggets de pollo rebozados + dip de salsa.", price: 6500, image: "https://images.unsplash.com/photo-1562967914-608f82629710?w=400" },
            { id: 13, name: "King Fries", category: "compartir", description: "Papas fritas, cheddar, bacon y verdeo.", price: 17000, image: "https://images.unsplash.com/photo-1585109649139-366815a0d713?w=400" }
        ];

        let cart = [];
        let currentCategory = 'todos';

        document.addEventListener("DOMContentLoaded", () => renderProducts(products));

        function renderProducts(list) {
            const grid = document.getElementById("products-grid");
            grid.innerHTML = "";
            list.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" alt="${p.name}" class="product-img">
                        <div class="product-info">
                            <div>
                                <h3>${p.name}</h3>
                                <p>${p.description}</p>
                            </div>
                            <div class="card-bottom">
                                <span class="price">$${p.price.toLocaleString()}</span>
                                <button class="btn-add" onclick="addToCart(${p.id})"><i class="fa-solid fa-plus"></i> Agregar</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function filterCategory(cat, e) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(e) e.target.classList.add('active');

            if(cat === 'todos') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === cat));
            }
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if (item) { item.quantity++; } else { cart.push({ ...prod, quantity: 1 }); }
            updateCartUI();
        }

        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((acc, item) => acc + item.quantity, 0);
            const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

            document.getElementById("cart-count").innerText = totalCount;
            document.getElementById("cart-total-price").innerText = `$${totalPrice.toLocaleString()}`;
            document.getElementById("modal-total-price").innerText = `$${totalPrice.toLocaleString()}`;

            const cartBar = document.getElementById("cart-bar");
            if (totalCount > 0) { cartBar.classList.remove("hidden"); } else { cartBar.classList.add("hidden"); }

            const itemsContainer = document.getElementById("cart-items");
            itemsContainer.innerHTML = "";
            cart.forEach(item => {
                itemsContainer.innerHTML += `
                    <div class="cart-item-row">
                        <div>
                            <span style="font-weight: 600;">${item.quantity}x ${item.name}</span><br>
                            <span style="font-size: 0.8rem; color: var(--accent-gold);">$${(item.price * item.quantity).toLocaleString()}</span>
                        </div>
                        <button onclick="removeItem(${item.id})" style="background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 1.1rem; padding: 5px;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>`;
            });
        }

        function toggleCartModal() { document.getElementById("cart-modal").classList.toggle("hidden"); }

        function sendOrderToWhatsApp() {
            if (cart.length === 0) return;
            const type = document.getElementById("delivery-type").value;
            const address = document.getElementById("client-address").value;
            const notes = document.getElementById("client-notes").value;

            let msg = `*PEDIDO WEB - THE KINGCHO BURGER*%0A-----------------------------------%0A`;
            cart.forEach(i => { msg += `• ${i.quantity}x ${i.name} ($${(i.price * i.quantity).toLocaleString()})%0A`; });
            const total = cart.reduce((acc, i) => acc + (i.price * i.quantity), 0);
            msg += `-----------------------------------%0A*Total:* $${total.toLocaleString()}%0A*Tipo:* ${type === 'delivery' ? 'Delivery' : 'Retiro por local'}%0A`;
            if(address) msg += `*Dirección:* ${address}%0A`;
            if(notes) msg += `*Notas:* ${notes}%0A`;

            window.open(`https://wa.me/${PHONE_NUMBER}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
